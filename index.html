<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Logístico</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: #60a5fa;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .meta-info {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: #64748b;
        }

        .filtros {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .btn-filtro {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid #334155;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-filtro:hover, .btn-filtro.active {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .grid-noticias {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card-noticia {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }

        .card-noticia:hover {
            transform: translateY(-4px);
        }

        .area-imagem img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .conteudo-noticia {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .badge {
            align-self: flex-start;
            background-color: var(--cor-categoria, var(--primary));
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
        }

        .card-noticia h2 {
            font-size: 1.1rem;
            line-height: 1.4;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .titulo-noticia {
            color: var(--text-main);
            text-decoration: none;
        }

        .titulo-noticia:hover {
            color: #60a5fa;
        }

        .rodape-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: auto;
            padding-top: 0.75rem;
            border-top: 1px solid #334155;
        }

        .botao-noticia {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
        }

        .aviso-vazio {
            text-align: center;
            grid-column: 1 / -1;
            padding: 3rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Radar Logístico</h1>
            <p>Informações em tempo real sobre Intralogística e Supply Chain</p>
            <div class="meta-info">
                Última atualização: {{HORARIO}} | {{QUANTIDADE}} notícias carregadas
            </div>
        </header>

        <nav class="filtros">
            {{FILTROS}}
        </nav>

        <main class="grid-noticias" id="gridNoticias">
            {{CARDS}}
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const botoes = document.querySelectorAll('.btn-filtro');
            const cards = document.querySelectorAll('.card-noticia');

            botoes.forEach(botao => {
                botao.addEventListener('click', () => {
                    botoes.forEach(b => b.classList.remove('active'));
                    botao.classList.add('active');

                    const filtro = botao.getAttribute('data-filter');

                    cards.forEach(card => {
                        if (filtro === 'todos' || card.getAttribute('data-categoria') === filtro) {
                            card.style.display = 'flex';
                        } else {
                            card.style.display = 'none';
                        }
                    });
                });
            });
        });
    </script>
</body>
</html>
