<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        header { text-align: center; padding: 20px 0 30px; }

        .logo-bsa {
            display: block;
            width: 220px;
            max-width: 80%;
            height: auto;
            margin: 0 auto 24px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitulo { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 8px; }
        .atualizacao { color: var(--text-muted); font-size: 0.85rem; opacity: 0.8; }

        .filtros-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .btn-filtro {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .btn-filtro:hover, .btn-filtro.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .grade-noticias {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .card-noticia {
            background: var(--bg-card);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card-noticia:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            border-color: var(--cor-categoria);
        }

        .area-imagem { 
            width: 100%; 
            height: 180px; 
            overflow: hidden; 
            background: radial-gradient(circle, rgba(30,41,59,1) 0%, rgba(15,23,42,1) 100%); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
        }

        .imagem-logo-fonte { 
            max-height: 75px; 
            width: auto; 
            object-fit: contain; 
            transition: transform 0.3s ease; 
        }

        .conteudo-noticia { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }

        .badge {
            align-self: flex-start;
            background: var(--cor-categoria);
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .card-noticia h2 { font-size: 1.1rem; line-height: 1.5; margin-bottom: 15px; font-weight: 600; }
        .titulo-noticia { color: var(--text-main); text-decoration: none; transition: color 0.2s ease; }
        .titulo-noticia:hover { color: var(--primary); }

        .rodape-card {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .data { color: var(--text-muted); font-size: 0.8rem; }
        .botao-noticia { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 0.85rem; }
        .botao-noticia:hover { text-decoration: underline; }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 50px;
            padding: 20px 0;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>

        const grid = document.getElementById('gridNoticias');

        function renderizar(filtro = 'todos') {
            grid.innerHTML = '';
            let total = 0;

            TODAS_NOTICIAS.forEach(item => {
                if (filtro === 'todos' || item.categoria === filtro) {
                    total++;
                    const cor = CORES[item.categoria] || '#3b82f6';
                    const logo = LOGOS[item.categoria];

                    const article = document.createElement('article');
                    article.className = 'card-noticia';
                    article.style.setProperty('--cor-categoria', cor);

                    let imagemHTML = logo 
                        ? `<img src="${logo}" alt="${item.categoria}" class="imagem-logo-fonte">`
                        : `<span style="font-size: 40px;">${ICONES[item.categoria] || '📰'}</span>`;

                    article.innerHTML = `
                        <div class="area-imagem">${imagemHTML}</div>
                        <div class="conteudo-noticia">
                            <span class="badge">${item.categoria.replace('-', ' ')}</span>
                            <h2><a href="${item.url}" target="_blank" rel="noopener" class="titulo-noticia">${item.titulo}</a></h2>
                            <div class="rodape-card">
                                <span class="data">🕒 ${item.data}</span>
                                <a href="${item.url}" target="_blank" rel="noopener" class="botao-noticia">Acessar ↗</a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(article);
                }
            });

            contador.textContent = total;
        }

        document.querySelectorAll('.btn-filtro').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('active'));

                renderizar(e.target.getAttribute('data-filter'));
            });
        });

        // Inicializa a listagem de todas as 40 notícias
        renderizar();
