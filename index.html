<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Radar Logístico e Intralogístico</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #eef3f6;
            color: #263238;
            margin: 0;
        }

        /* CABEÇALHO */

        .cabecalho {
            background:
                linear-gradient(
                    135deg,
                    #003f7d,
                    #0072ce
                );
            color: white;
            padding: 45px 20px;
            text-align: center;
        }

        .cabecalho-conteudo {
            max-width: 1100px;
            margin: 0 auto;
        }

        .cabecalho h1 {
            margin: 0 0 10px;
            font-size: 34px;
        }

        .cabecalho .subtitulo {
            margin: 0 0 14px;
            font-size: 17px;
            opacity: 0.92;
        }

        .cabecalho .atualizacao {
            margin: 0;
            font-size: 13px;
            opacity: 0.80;
        }

        /* CONTEÚDO */

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        .titulo-secao {
            margin: 0 0 22px;
            color: #12344d;
            font-size: 23px;
        }

        /* GRADE DE NOTÍCIAS */

        .grade-noticias {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        /* CARD */

        .card-noticia {
            --cor-categoria: #0056b3;

            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow:
                0 4px 14px rgba(0, 0, 0, 0.10);

            border-top:
                5px solid var(--cor-categoria);

            display: flex;
            flex-direction: column;
            min-width: 0;

            transition:
                transform 0.20s ease,
                box-shadow 0.20s ease;
        }

        .card-noticia:hover {
            transform: translateY(-4px);

            box-shadow:
                0 9px 22px rgba(0, 0, 0, 0.15);
        }

        /* IMAGEM */

        .area-imagem {
            width: 100%;
            height: 190px;
            overflow: hidden;
            background:
                linear-gradient(
                    135deg,
                    var(--cor-categoria),
                    #102a43
                );
        }

        .imagem-noticia {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;

            transition:
                transform 0.30s ease;
        }

        .card-noticia:hover .imagem-noticia {
            transform: scale(1.04);
        }

        /* INFORMAÇÕES */

        .conteudo-noticia {
            padding: 21px;

            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-width: 0;
        }

        .badge {
            align-self: flex-start;

            background: var(--cor-categoria);
            color: white;

            padding: 5px 10px;
            border-radius: 20px;

            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .card-noticia h2 {
            margin: 15px 0 12px;
            font-size: 19px;
            line-height: 1.38;

            overflow-wrap: anywhere;
        }

        .titulo-noticia {
            color: #172b3a;
            text-decoration: none;
        }

        .titulo-noticia:hover {
            color: var(--cor-categoria);
        }

        .data {
            color: #71808a;
            font-size: 13px;
            margin: 0 0 20px;
        }

        /* BOTÃO */

        .botao-noticia {
            display: inline-block;
            align-self: flex-start;

            margin-top: auto;
            padding: 10px 17px;

            background: var(--cor-categoria);
            color: white;

            border-radius: 7px;
            text-decoration: none;

            font-size: 14px;
            font-weight: 700;

            transition:
                filter 0.20s ease,
                transform 0.20s ease;
        }

        .botao-noticia:hover {
            filter: brightness(0.82);
            transform: translateY(-1px);
        }

        /* MENSAGEM SEM NOTÍCIAS */

        .mensagem-vazia {
            grid-column: 1 / -1;

            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;

            box-shadow:
                0 4px 14px rgba(0, 0, 0, 0.08);
        }

        /* RODAPÉ */

        footer {
            margin-top: 40px;
            padding: 25px 15px;

            border-top: 1px solid #d5dde2;

            color: #71808a;
            font-size: 12px;
            text-align: center;
        }

        /* CELULAR */

        @media (max-width: 760px) {
            .cabecalho {
                padding: 32px 16px;
            }

            .cabecalho h1 {
                font-size: 27px;
            }

            .cabecalho .subtitulo {
                font-size: 15px;
            }

            .container {
                padding: 24px 14px;
            }

            .grade-noticias {
                grid-template-columns: 1fr;
            }

            .area-imagem {
                height: 200px;
            }
        }
    </style>
</head>

<body>

    <header class="cabecalho">
        <div class="cabecalho-conteudo">

            <h1>
                Radar Logístico &amp; Intralogístico
            </h1>

            <p class="subtitulo">
                Notícias sobre armazenagem, automação,
                intralogística e Supply Chain
            </p>

            <p class="atualizacao">
                Última atualização:
                <!-- ULTIMA_ATUALIZACAO -->
            </p>

        </div>
    </header>

    <div class="container">

        <h2 class="titulo-secao">
            Últimas notícias
        </h2>

        <main class="grade-noticias">

            <!-- NOTICIAS_AQUI -->

        </main>

        <footer>
            Conteúdo agregado por pesquisa no Google News.
            Os títulos direcionam para as publicações originais.
        </footer>

    </div>

</body>

</html>
