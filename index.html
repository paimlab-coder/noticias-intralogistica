<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Logístico & Intralogístico | Bertolini BSA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; padding: 20px 0 30px; }

        .logo-bsa {
            display: block;
            width: 220px;
            max-width: 80%;
            height: auto;
            margin: 0 auto 24px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitulo { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 8px; }
        .atualizacao { color: var(--text-muted); font-size: 0.85rem; opacity: 0.8; }

        .filtros-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .btn-filtro {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .btn-filtro:hover, .btn-filtro.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .grade-noticias {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .card-noticia {
            background: var(--bg-card);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card-noticia:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            border-color: var(--cor-categoria);
        }

        .area-imagem { 
            width: 100%; 
            height: 160px; 
            overflow: hidden; 
            background: radial-gradient(circle, rgba(30,41,59,1) 0%, rgba(15,23,42,1) 100%); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
        }

        .imagem-logo-fonte { 
            max-height: 65px; 
            width: auto; 
            object-fit: contain; 
        }

        .conteudo-noticia { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }

        .badge {
            align-self: flex-start;
            background: var(--cor-categoria);
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .card-noticia h2 { font-size: 1.05rem; line-height: 1.5; margin-bottom: 15px; font-weight: 600; }
        .titulo-noticia { color: var(--text-main); text-decoration: none; transition: color 0.2s ease; }
        .titulo-noticia:hover { color: var(--primary); }

        .rodape-card {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .data { color: var(--text-muted); font-size: 0.8rem; }
        .botao-noticia { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 0.85rem; }
        .botao-noticia:hover { text-decoration: underline; }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            font-size: 1.2rem;
            padding: 40px 0;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 50px;
            padding: 20px 0;
            border-top: 1px solid var(--border-color);
        }

        .escondido { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="https://www.bertoliniarmazenagem.com.br/wp-content/uploads/2024/11/bertolini-logo-claro.svg" alt="Bertolini Sistemas de Armazenagem" class="logo-bsa">
            
            <h1>Radar Logístico & Intralogístico</h1>
            <p class="subtitulo">Feeds Oficiais dos Últimos 30 Dias (Ordem Decrescente)</p>
            <p class="atualizacao">Sincronizado automaticamente | <span id="contadorNoticias">Carregando...</span></p>
        </header>

        <div class="filtros-container">
            <button class="btn-filtro active" data-filter="todos">Todas</button>
            <button class="btn-filtro" data-filter="mundo-logistica">Mundo Logística</button>
            <button class="btn-filtro" data-filter="logweb">Logweb</button>
            <button class="btn-filtro" data-filter="tecnologistica">Tecnologística</button>
        </div>

        <main class="grade-noticias" id="gridNoticias">
            <div class="loading" id="loadingText">⏳ Carregando notícias em tempo real...</div>
        </main>

        <footer>
            <p>Bertolini Sistemas de Armazenagem &copy; 2026</p>
        </footer>
    </div>

    <script>
        const LOGOS = {
            'logweb': 'https://logweb.com.br/wp-content/uploads/2023/07/lwn-03-Branco-Vazado.png',
            'mundo-logistica': 'https://mundologistica.com.br/images/revistamundologistica_.svg',
            'tecnologistica': 'https://www.tecnologistica.com.br/imagens/geral/logo_dt.webp'
        };

        const CORES = {
            'logweb': '#005CA9',
            'mundo-logistica': '#C2410C',
            'tecnologistica': '#1E3A8A'
        };

        // Feeds RSS Oficiais dos Portais
        const FEEDS = [
            { id: 'mundo-logistica', nome: 'Mundo Logística', url: 'https://news.google.com/rss/search?q=site:mundologistica.com.br&hl=pt-BR&gl=BR&ceid=BR:pt-419' },
            { id: 'logweb', nome: 'Logweb', url: 'https://news.google.com/rss/search?q=site:logweb.com.br&hl=pt-BR&gl=BR&ceid=BR:pt-419' },
            { id: 'tecnologistica', nome: 'Tecnologística', url: 'https://news.google.com/rss/search?q=site:tecnologistica.com.br&hl=pt-BR&gl=BR&ceid=BR:pt-419' }
        ];

        let TODAS_NOTICIAS = [];

        async function carregarNoticias() {
            const grid = document.getElementById('gridNoticias');
            const contador = document.getElementById('contadorNoticias');

            try {
                for (let feed of FEEDS) {
                    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`;
                    const response = await fetch(apiUrl);
                    const data = await response.json();

                    if (data.status === 'ok' && data.items) {
                        data.items.forEach(item => {
                            TODAS_NOTICIAS.push({
                                titulo: item.title,
                                link: item.link,
                                data: new Date(item.pubDate),
                                fonteId: feed.id,
                                fonteNome: feed.nome
                            });
                        });
                    }
                }

                // Ordena rigorosamente da notícia mais recente para a mais antiga (ordem decrescente)
                TODAS_NOTICIAS.sort((a, b) => b.data - a.data);

                renderizarNoticias('todos');
            } catch (error) {
                console.error("Erro ao carregar notícias:", error);
                grid.innerHTML = '<div class="loading">Erro ao carregar feeds. Recarregue a página.</div>';
            }
        }

        function renderizarNoticias(filtro) {
            const grid = document.getElementById('gridNoticias');
            const contador = document.getElementById('contadorNoticias');
            grid.innerHTML = '';

            let visiveis = 0;

            TODAS_NOTICIAS.forEach(item => {
                if (filtro === 'todos' || item.fonteId === filtro) {
                    visiveis++;
                    const cor = CORES[item.fonteId] || '#3b82f6';
                    const logo = LOGOS[item.fonteId];

                    const dataFormatada = item.data.toLocaleDateString('pt-BR', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    const article = document.createElement('article');
                    article.className = 'card-noticia';
                    article.style.setProperty('--cor-categoria', cor);
                    article.setAttribute('data-categoria', item.fonteId);

                    article.innerHTML = `
                        <div class="area-imagem">
                            <img src="${logo}" alt="${item.fonteNome}" class="imagem-logo-fonte">
                        </div>
                        <div class="conteudo-noticia">
                            <span class="badge">${item.fonteNome}</span>
                            <h2><a href="${item.link}" target="_blank" rel="noopener noreferrer" class="titulo-noticia">${item.titulo}</a></h2>
                            <div class="rodape-card">
                                <span class="data">🕒 ${dataFormatada}</span>
                                <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="botao-noticia">Acessar Notícia ↗</a>
                            </div>
                        </div>
                    `;
                    grid.appendChild(article);
                }
            });

            contador.textContent = `${visiveis} notícias carregadas`;
        }

        // Eventos dos Filtros
        document.querySelectorAll('.btn-filtro').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderizarNoticias(e.target.getAttribute('data-filter'));
            });
        });

        // Inicializa a busca automatizada ao abrir a página
        carregarNoticias();
    </script>
</body>
</html>
